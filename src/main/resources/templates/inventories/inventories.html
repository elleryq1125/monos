<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{common/head :: head-fragment(title = '在庫一覧', scripts = ~{}, links = ~{})}">
	</head>
	<body>
		<!-- ヘッダー -->
		<div th:replace="~{common/header :: header-fragment}"></div>
		
		<!-- メイン -->
		<main class="wrapper">
			
			<!--検索フォーム -->
			<form class="search-form" id="searchForm" th:action="@{/inventories}" th:object="${inventorySearchForm}" method="get">
				<div class="form-row">
					<div class="form-field">
						<label>商品コード</label>
						<input type="text" th:field="*{productCode}">
					</div>
					<div class="form-field">
						<label>商品名</label>
						<input class="" type="text" th:field="*{productName}">
					</div>
					<div class="form-field">
						<label>倉庫コード</label>
						<input type="text" th:field="*{warehouseCode}">
					</div>
					<div class="form-field">
						<label>倉庫名</label>
						<input class="" type="text" th:field="*{warehouseName}">
					</div>
					<div class="form-field">
						<label for="stockOut">欠品</label>
						<input class="w-15" type="checkbox" th:field="*{stockOut}" >
					</div>
					<div class="form-actions">
						<button class="btn search-btn" type="submit">検索</button>
					</div>
				</div>
			</form>
			
			<div id="proccessButtons">
			</div>
			
			<div class="content">
				<div class="contentTitle">
					在庫一覧
				</div>
				<div class="data-table" style="height: 400px;">
					<table style="width: 90%;">
						<thead>
							<tr>
								<th style="width: 12%;">商品コード</th>
								<th style="width: 20%;">商品名</th>
								<th style="width: 12%;">倉庫コード</th>
								<th style="width: 20%;">倉庫名</th>
								<th style="width: 8%;">在庫数量</th>
								<th style="width: 8%;">出庫予定数量</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="inventory:${inventories}" th:object="${inventory}">
								<td th:text="*{productCode}"></td>
								<td th:text="*{productName}"></td>
								<td th:text="*{warehouseCode}"></td>
								<td th:text="*{warehouseName}"></td>
								<td th:text="*{onHandQty}"></td>
								<td th:text="*{totalScheduleQty}"></td>
							</tr> 
						</tbody>
					</table>
				</div>
			</div>
		</main>
		
		<!-- フッター -->
		<div th:replace="~{common/footer :: footer-fragment}"></div>
		
		<!-- アラート -->
		<div th:replace="~{common/alert :: alert-fragment}"></div>
		
	</body>
</html>
