<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{common/head :: head-fragment(title = '入庫予定一覧', scripts = ~{::script}, links = ~{})}">
		<script th:src="@{/scripts/warehouses.js}"></script>
	</head>
	<body>
		<!-- ヘッダー -->
		<div th:replace="~{common/header :: header-fragment}"></div>
		
		<!-- メイン -->
		<main class="wrapper">
			
			<!--検索フォーム -->
			<form class="search-form" id="searchForm" th:action="@{/inboundschedules}" th:object="${inboundScheduleSearchForm}" method="get">
				<div class="form-row">
					<div class="form-field">
						<label>商品コード</label>
						<input type="text" th:field="*{productCode}">
					</div>
					<div class="form-field">
						<label>商品名</label>
						<input class="" type="text" th:field="*{productName}">
					</div>
					<div class="form-field">
						<label>倉庫コード</label>
						<input type="text" th:field="*{warehouseCode}">
					</div>
					<div class="form-field">
						<label>倉庫名</label>
						<input class="" type="text" th:field="*{warehouseName}">
					</div>
					<div class="form-field">
						<label for="active">状態</label>
						<select class="form-select"  th:field="*{statusValue}">
							<option th:each="status : ${statuses}" th:value="${status.code}">[[${status.name}]]</option>
						</select>
					</div>
					<div class="form-actions">
						<button class="btn search-btn" type="submit">検索</button>
					</div>
				</div>
			</form>
			
			<div id="proccessButtons">
				<button class="btn main-btn" data-bs-toggle="modal" data-bs-target="#warehouseModal" onclick="openWarehouseAddModal()" >追加</button>
			</div>
			
			<div class="content">
				<div class="contentTitle">
					入庫予定一覧
				</div>
				<div class="data-table" style="height: 400px;">
					<table style="width: 1200px;">
						<thead>
							<tr>
								<th style="width: 7%;">状態</th>
								<th style="width: 10%;">商品コード</th>
								<th style="width: 20%;">商品名</th>
								<th style="width: 10%;">倉庫コード</th>
								<th style="width: 20%;">倉庫名</th>
								<th style="width: 8%;">予定数量</th>
								<th style="width: 10%;">予定日</th>
								<th style="width: 8%;">実績数量</th>
								<th style="width: 7%;"></th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="inboundschedule:${inboundschedules}" th:object="${inboundschedule}">
								<td th:text="*{status}"></td>
								<td th:text="*{productCode}"></td>
								<td th:text="*{productName}"></td>
								<td th:text="*{warehouseCode}"></td>
								<td th:text="*{warehouseName}"></td>
								<td th:text="*{scheduleQty}"></td>
								<td th:text="${#dates.format(inboundschedule.scheduleDate, 'yyyy/MM/dd')}"></td>
								<td th:text=""></td>
								<td>
									<button class="btn main-btn" data-bs-toggle="modal" data-bs-target="#warehouseModal" th:onclick="'openWarehouseUpdateModal(' + *{warehouseId} + ')'">更新</button>
								</td>
							</tr> 
						</tbody>
					</table>
				</div>
			</div>
			
			<!-- モーダル -->
			<div class="modal fade" data-bs-backdrop="static" id="warehouseModal" tabindex="-1">
			  <div class="modal-dialog">
			    <div class="modal-content">
			
			      <div class="modal-header">
			        <h6 id="modalTitle" class="modal-title">倉庫登録</h6>
			        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			      </div>
			
			      <div class="modal-body">	
			        <form id="productForm">
						
			          <input type="hidden" id="modalWarehouseId">
			          
			          <div class="mb-3 form-field">
						  <label class="required">倉庫コード</label>
						  <input type="text" class="w-120" id="modalWarehouseCode">
					      <div class="field-error" id="warehouseCodeError"></div>
					  </div>
			          
			          <div class="mb-3 form-field">
			            <label>倉庫名</label>
			            <input type="text" id="modalName">
				        <div class="field-error" id="nameError"></div>
			          </div>
			          
			          <div class="mb-3 form-field">
			            <label class="form-label" for="modalActive">有効化</label>
			            <input type="checkbox" class="w-15" id="modalActive">
			          </div>
			
			        </form>
			      </div>
			
			      <div class="modal-footer">
			        <button class="btn main-btn" onclick="saveWarehouse()">保存</button>
			        <button class="btn grey-btn" data-bs-dismiss="modal">閉じる</button>
			      </div>
			
			    </div>
			  </div>
		</main>
		
		<!-- フッター -->
		<div th:replace="~{common/footer :: footer-fragment}"></div>
		
		<!-- アラート -->
		<div th:replace="~{common/alert :: alert-fragment}"></div>
		
	</body>
</html>
