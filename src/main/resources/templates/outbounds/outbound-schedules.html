<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{common/head :: head-fragment(title = '出庫予定一覧', scripts = ~{::script}, links = ~{})}">
		<script th:src="@{/scripts/outbound-schedules.js}"></script>
	</head>
	<body>
		<!-- ヘッダー -->
		<div th:replace="~{common/header :: header-fragment}"></div>
		
		<!-- メイン -->
		<main class="wrapper">
			
			<!--検索フォーム -->
			<form class="search-form" id="searchForm" th:action="@{/outbound-schedules}" th:object="${outboundScheduleSearchForm}" method="get">
				<div class="form-row">
					<div class="form-field">
						<label>商品コード</label>
						<input type="text" th:field="*{productCode}">
					</div>
					<div class="form-field">
						<label>商品名</label>
						<input class="" type="text" th:field="*{productName}">
					</div>
					<div class="form-field">
						<label>倉庫コード</label>
						<input type="text" th:field="*{warehouseCode}">
					</div>
					<div class="form-field">
						<label>倉庫名</label>
						<input class="" type="text" th:field="*{warehouseName}">
					</div>
					<div class="form-field">
						<label for="active">状態</label>
						<select class="form-select"  th:field="*{statusValue}">
							<option th:each="status : ${statuses}" th:value="${status.code}">[[${status.name}]]</option>
						</select>
					</div>
					<div class="form-actions">
						<button class="btn search-btn" type="submit">検索</button>
					</div>
				</div>
			</form>
			
			<div id="proccessButtons">
				<button class="btn main-btn" data-bs-toggle="modal" data-bs-target="#outboundScheduleModal" onclick="openOutboundScheduleAddModal()" >追加</button>
			</div>
			
			<div class="content">
				<div class="contentTitle">
					出庫予定一覧
				</div>
				<div class="data-table" style="height: 400px;">
					<table style="width: 100%;">
						<thead>
							<tr>
								<th style="width: 6%;">状態</th>
								<th style="width: 9%;">商品コード</th>
								<th style="width: 19%;">商品名</th>
								<th style="width: 9%;">倉庫コード</th>
								<th style="width: 19%;">倉庫名</th>
								<th style="width: 8%;">予定数量</th>
								<th style="width: 9%;">予定日</th>
								<th style="width: 8%;">実績数量</th>
								<th style="width: 7%;"></th>
								<th style="width: 7%;"></th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="outboundschedule:${outboundschedules}" th:object="${outboundschedule}">
								<td th:text="*{statusName}"></td>
								<td th:text="*{productCode}"></td>
								<td th:text="*{productName}"></td>
								<td th:text="*{warehouseCode}"></td>
								<td th:text="*{warehouseName}"></td>
								<td th:text="*{scheduleQty}"></td>
								<td th:text="${#dates.format(outboundschedule.scheduleDate, 'yyyy/MM/dd')}"></td>
								<td th:text="*{totalResultQty}"></td>
								<td>
									<!-- 出庫済・キャンセル以外で表示 -->
									<button th:disabled="*{status == 2 or status == 3}" class="btn main-btn" data-bs-toggle="modal" data-bs-target="#outboundScheduleModal" th:onclick="'openOutboundScheduleUpdateModal(' + *{outboundScheduleId} + ')'">更新</button>
								</td>
								<td>
									<!-- 出庫済・キャンセル以外で表示 -->
									<button th:disabled="*{status == 2 or status == 3}" class="btn main-btn" data-bs-toggle="modal" data-bs-target="#outboundResultModal" th:onclick="'openOutboundResultModal(' + *{outboundScheduleId} + ')'">出庫</button>
								</td>
							</tr> 
						</tbody>
					</table>
				</div>
			</div>
			
			<!-- モーダル -->
			<div class="modal fade" data-bs-backdrop="static" id="outboundScheduleModal" tabindex="-1">
			  <div class="modal-dialog">
			    <div class="modal-content">
			
			      <div class="modal-header">
			        <h6 id="modalTitle" class="modal-title">出庫予定登録</h6>
			        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			      </div>
			
			      <div class="modal-body">	
			        <form id="outboundScheduleForm">
						
			          <input type="hidden" id="modalOutboundScheduleId">
			          <input type="hidden" id="modalOutboundScheduleVersion">
			          
			          <div class="mb-3 form-field position-relative">
						  <label>商品キーワード</label>
						  <input type="text" class="w-200" id="modalProductKeyword" autocomplete="off">
						  <ul id="modalProductSuggestList" class="list-group position-absolute top-100 start-0 w-200" style="z-index:1060;"></ul>
					  </div>
					  
					  <div class="mb-3 form-field">
						  <label class="required">商品</label>
						  <input type="text" class="w-200 " id="modalProduct" disabled>
						  <input type="hidden" id="modalProductId">
					      <div class="field-error" id="productIdError"></div>
					  </div>
			          
			          <div class="mb-3 form-field">
						  <label class="required">在庫</label>
						  <select class="form-select w-400"  id="modalInventory">
						  </select>
					      <div class="field-error" id="inventoryIdError"></div>
					  </div>
					  
					  <div class="mb-3 form-field">
						  <label class="required">予定数量</label>
						  <input type="number" class="w-80 " id="modalScheduleQty">
					      <div class="field-error" id="scheduleQtyError"></div>
					  </div>
					  
					  <div class="mb-3 form-field">
						  <label class="required">予定日</label>
						  <input type="date" class="w-140 " id="modalScheduleDate">
					      <div class="field-error" id="scheduleDateError"></div>
					  </div>
					  
			        </form>
			      </div>
			
			      <div class="modal-footer">
			        <button class="btn main-btn" onclick="saveOutboundSchedule()">保存</button>
			        <button class="btn grey-btn" data-bs-dismiss="modal">閉じる</button>
			      </div>
			
			    </div>
			    </div>
			  </div>

			<div class="modal fade" data-bs-backdrop="static" id="outboundResultModal" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
		
						<div class="modal-header">
							<h6 id="modalTitle" class="modal-title">出庫実績登録</h6>
							<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
						</div>
				
						<div class="modal-body">	
							<form id="outboundScheduleForm">
								<input type="hidden" id="modalOutboundScheduleId">
								<input type="hidden" id="modalVersion">
								
								<div class="mb-3 form-field">
									<label>商品</label>
									<input type="text" class="w-200" id="modalProduct" disabled>
								</div>
								
								<div class="mb-3 form-field">
									<label>倉庫</label>
									<input type="text" class="w-200" id="modalWarehouse" disabled>
								</div>
								
								<div class="row mb-3">
									<div class="col-md-4 form-field">
										<label>出庫予定数量</label>
										<input type="number" class="w-80" id="modalScheduleQty" disabled>
									</div>
									
									<div class="col-md-8 form-field">
										<label>出庫予定日</label>
										<input type="date" class="w-140" id="modalScheduleDate" disabled>
									</div>
								</div>

								<div class="mb-3 form-field">
									<label>出庫済数量</label>
									<input type="number" class="w-80" id="modalTotalResultQty" disabled>
								</div>
								
								<div class="row mb-3">
									<div class="col-md-4 form-field">
										<label class="required">出庫数量</label>
										<input type="number" class="w-80" id="modalResultQty">
										<div class="field-error" id="resultQtyError"></div>
									</div>
									
									<div class="col-md-8 form-field">
										<label class="required">出庫日</label>
										<input type="date" class="w-140" id="modalResultDate">
										<div class="field-error" id="resultDateError"></div>
									</div>
								</div>
							</form>
						</div>
		
						<div class="modal-footer">
							<button class="btn main-btn" onclick="registerOutboundResult()">登録</button>
							<button class="btn grey-btn" data-bs-dismiss="modal">閉じる</button>
						</div>
		
					</div>
				</div>
			</div>
		</main>
		
		<!-- フッター -->
		<div th:replace="~{common/footer :: footer-fragment}"></div>
		
		<!-- アラート -->
		<div th:replace="~{common/alert :: alert-fragment}"></div>
		
	</body>
</html>
