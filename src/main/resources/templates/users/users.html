<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{common/head :: head-fragment(title = 'ユーザー一覧', scripts = ~{::script}, links = ~{::link})}">
		<link rel="stylesheet" th:href="@{/css/users.css}">
		<script th:src="@{/scripts/users.js}"></script>
	</head>
	<body>
		<!-- ヘッダー -->
		<div th:replace="~{common/header :: header-fragment}"></div>
		
		<!-- メイン -->
		<main class="wrapper">
			<div id="proccessButtons">
				<a class="btn main-btn" href="/users/add">追加</a>
			</div>
			<div id="content">
				<div id="contentTitle">
					ユーザー一覧
				</div>
				<div class="data-table" style="height: 400px;">
					<table style="width: 800px;">
						<thead>
							<tr>
								<th style="width: 20%;">氏名</th>
								<th style="width: 30%;">メールアドレス</th>
								<th style="width: 10%">権限</th>
								<th style="width: 14%;">更新日</th>
								<th style="width: 13%;"></th>
								<th style="width: 13%;"></th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="user:${companyUsers}" th:object="${user}">
								<td th:text="*{name}"></td>
								<td th:text="*{email}"></td>
								<td th:text="*{roleName}"></td>
								<td th:text="${#dates.format(user.updatedAt, 'yyyy/MM/dd')}"></td>
								<td>
									<a class="btn main-btn" th:href="@{/users/update/{userId}(userId=*{userId})}">更新</a>
								</td>
								<td>
									<form method="post" name="user-delete" th:action="@{/users/delete/{userId}(userId=*{userId})}" th:attr="data-user-name=*{name}">
										<button class="btn grey-btn" type="submit">削除</button>
									</form>
								</td>
							</tr> 
						</tbody>
					</table>
				</div>
			</div>
		</main>
		
		<!-- フッター -->
		<div th:replace="~{common/footer :: footer-fragment}"></div>
		
		<!-- アラート -->
		<div th:replace="~{common/alert :: alert-fragment}"></div>
	</body>
</html>
