<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{common/head :: head-fragment(title = '商品一覧', scripts = ~{}, links = ~{})}">
	</head>
	<body>
		<!-- ヘッダー -->
		<div th:replace="~{common/header :: header-fragment}"></div>
		
		<!-- メイン -->
		<main class="wrapper">
			
			<!--検索フォーム -->
			<form class="search-form" th:action="@{/products}" th:object="${productSearchForm}" method="get">
				<div class="form-row">
					<div class="form-field">
						<label>商品コード</label>
						<input type="text" th:field="*{productCode}">
					</div>
					<div class="form-field">
						<label>商品名</label>
						<input class="" type="text" th:field="*{name}">
					</div>
					<div class="form-actions">
						<button class="btn search-btn" type="submit">検索</button>
					</div>
				</div>
			</form>
			
			<div id="proccessButtons">
				<a class="btn main-btn" href="/users/add">追加</a>
			</div>
			
			<div class="content">
				<div class="contentTitle">
					商品一覧
				</div>
				<div class="data-table" style="height: 400px;">
					<table style="width: 800px;">
						<thead>
							<tr>
								<th style="width: 20%;">コード</th>
								<th style="width: 30%;">商品名</th>
								<th style="width: 10%">単位</th>
								<th style="width: 14%;">更新日</th>
								<th style="width: 13%;"></th>
								<th style="width: 13%;"></th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="product:${products}" th:object="${product}">
								<td th:text="*{productCode}"></td>
								<td th:text="*{name}"></td>
								<td th:text="*{unit}"></td>
								<td th:text="${#dates.format(product.updatedAt, 'yyyy/MM/dd')}"></td>
								<!--<td>
									<a class="btn main-btn" th:href="@{/users/update/{userId}(userId=*{userId})}">更新</a>
								</td>
								<td>
									<form method="post" name="user-delete" th:action="@{/users/delete/{userId}(userId=*{userId})}" th:attr="data-user-name=*{name}">
										<button  class="btn grey-btn" type="submit">削除</button>
									</form>
								</td>-->
							</tr> 
						</tbody>
					</table>
				</div>
			</div>
		</main>
		
		<!-- フッター -->
		<div th:replace="~{common/footer :: footer-fragment}"></div>
		
		<!-- アラート -->
		<div th:replace="~{common/alert :: alert-fragment}"></div>
	</body>
</html>
