<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head-fragment(title = 'サインアップ', scripts = ~{}, links = ~{::link})}">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
	<div class="wrapper">
		<div id="signupLogobox">
			<img th:src="@{/images/logo.png}" alt="monos"></img>
		</div>
		<div id="signupFormbox">
			<form method="post" th:action="@{/signup}" th:object="${signupForm}">
				<div class="form-group">
					<div class="signup-field">
						<label class="required" for="name">氏名</label>
						<input class="form-control" type="text" th:field="*{name}" placeholder="例）物　太郎">
						<div class="signup-field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
					</div>
					<div class="signup-field">
						<label class="required" for="email">メールアドレス</label>
						<input class="form-control"  type="email" th:field="*{email}" placeholder="例）example@monos.jp">
						<div class="signup-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
					</div>
					<div class="signup-field">
						<label class="required" for="password">パスワード</label>
						<input class="form-control" type="password" th:field="*{password}">
						<div class="signup-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
					</div>
					<div class="signup-field">
						<label class="required" for="passwordConfirm">パスワード（再入力）</label>
						<input  class="form-control" type="password" th:field="*{passwordConfirm}">
						<div  class="signup-field-error" th:if="*{#fields.hasErrors('passwordValid')}" th:errors="*{passwordValid}"></div>
					</div>
					<div class="signup-field">
						<label class="required" for="companyName">会社名</label>
						<input class="form-control" type="text" th:field="*{companyName}" placeholder="例）株式会社monos">
						<div  class="signup-field-error" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
					</div>
					<div id="signupButtonBox">
						<button  class="btn main-btn" type="submit">ユーザー登録</button>
					</div>
				</div>
			</form>	
		</div>
	</div>
	
	<!-- フッター -->
	<div th:replace="~{common/footer :: footer-fragment}"></div>
	
</body>
</html>
