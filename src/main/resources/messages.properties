### フォーム毎メッセージ ###

#SignupForm
signupForm.name=氏名
NotBlank.signupForm.name={0}を入力してください
Size.signupForm.name={0}は{1}桁以内で入力してください

signupForm.email=メールアドレス
NotBlank.signupForm.email={0}を入力してください
Size.signupForm.email={0}は{1}桁以内で入力してください

signupForm.password=パスワード
NotBlank.signupForm.password={0}を入力してください
Size.signupForm.password={0}は{1}桁以内で入力してください

signupForm.companyName=会社名
NotBlank.signupForm.companyName={0}を入力してください
Size.signupForm.companyName={0}は{1}桁以内で入力してください

AssertTrue.signupForm.passwordValid=パスワードと一致していません

#UserAddForm
userAddForm.name=氏名
NotBlank.userAddForm.name={0}を入力してください
Size.userAddForm.name={0}は{1}桁以内で入力してください

userAddForm.email=メールアドレス
NotBlank.userAddForm.email={0}を入力してください
Size.userAddForm.email={0}は{1}桁以内で入力してください

userAddForm.password=パスワード
NotBlank.userAddForm.password={0}を入力してください
Size.userAddForm.password={0}は{1}桁以内で入力してください

AssertTrue.userAddForm.passwordValid=パスワードと一致していません

#UserUpdateForm
userUpdateForm.name=氏名
NotBlank.userUpdateForm.name={0}を入力してください
Size.userUpdateForm.name={0}は{1}桁以内で入力してください

#商品一覧
NotBlank.productInputForm.productCode=入力は必須です
Pattern.productInputForm.productCode=英大文字、数字、ハイフンのいずれかで入力してください
Size.productInputForm.productCode={max}桁以内で入力してください
Size.productInputForm.name={max}桁以内で入力してください
Size.productInputForm.unit={max}桁以内で入力してください
existsProductCode=入力された商品コードは既に存在します


tempUserRegistComplete=入力したメールアドレス宛に仮登録完了メールを送信しました。
urlExpired=アドレスの有効期限が切れています。\nお手数ですが再度サインアップを行ってください。
emailExists={0}は既に登録済です。\n別のメールアドレスを使用してサインアップしてください。
userRegistComplete=本登録が完了しました。
userInfoNotExists=ユーザー情報が存在しません。他の利用者によって更新された可能性があります。
isSigninUser=サインイン中のユーザーです。	

### 共通メッセージ ###
dataNotExists=データが取得できませんでした。
filedError=入力エラーがあります。
registComplete=登録が完了しました。
updateComplete=更新が完了しました。
updateFaild=更新が失敗しました。
deleteComplete=削除が完了しました。
deleteFaild=削除に失敗しました。
systemException=システムエラーが発生しました。